# For a computer in the shop (no internet name or HTTPS needed).
#   cp .env.example .env     (only POSTGRES_PASSWORD and ADMIN_TOKEN matter here)
#   docker compose -f docker-compose.local.yml up -d
# First run:  powershell -ExecutionPolicy Bypass -File get-tablet-app.ps1   (downloads the order pad)
# Then open  http://<this computer's address>:3000/  on the tablets (order pad)  and  /pos/  on the counter.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpos
      POSTGRES_USER: hpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpos -d hpos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hpos:${POSTGRES_PASSWORD}@db:5432/hpos
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (at least 16 characters)}
      ALLOWED_ORIGINS: "*"
      WEB_DIR: /web
      PORT: "3000"
    volumes:
      - ./tablet/index.html:/web/index.html:ro        # order pad (run get-tablet-app.ps1 to update)
      - ../index.html:/web/pos/index.html:ro          # POS
    ports:
      - "3000:3000"      # reachable from the shop Wi-Fi

volumes:
  dbdata:
