<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Super admin</title>
<style>
:root{--acc:#df3d8a;--accd:#b82a6f;--ink:#1c1a1f;--mut:#6c6a70;--line:#e9e6e1;--bg:#f6f4f2;--ok:#14815f;--okbg:#e4f4ed;--bad:#c4543a;--badbg:#fbe8e3;--warn:#a86a08;--warnbg:#fdf0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} header small{color:var(--mut);font-size:13px}
main{padding:14px 16px 90px;max-width:1100px;margin:0 auto}
input,select{font:inherit;font-size:16px;border:1px solid #ddd8d1;border-radius:11px;padding:0 12px;height:44px;background:#fff;min-width:0;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:500}
button{font:inherit;font-weight:600;border-radius:11px;border:1px solid #ddd8d1;background:#fff;color:var(--ink);height:44px;padding:0 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff} button.sm{height:36px;padding:0 12px;font-size:14px} button.dng{color:var(--bad);border-color:#f0c9bf} button.gh{border-color:transparent;background:transparent;color:var(--accd)} button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px} .stat b{display:block;font-size:22px;line-height:1.1} .stat span{font-size:12px;color:var(--mut)}
.stat.w b{color:var(--warn)} .stat.b b{color:var(--bad)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap} .bar .s{flex:1;min-width:200px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px} .chip{height:36px;border-radius:99px;padding:0 14px;font-size:14px;font-weight:600;white-space:nowrap;background:#fff} .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.co{margin:18px 0 8px;display:flex;align-items:center;gap:8px} .co h2{margin:0;font-size:15px;font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.05em;color:#6b665f}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.card .top{display:flex;gap:8px;align-items:flex-start} .card .nm{flex:1;min-width:0} .card .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .card .nm span{font-size:13px;color:var(--mut)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f3f0ec;border-radius:7px;padding:2px 7px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600} .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--okbg)} .pill.bad{color:var(--bad);background:var(--badbg)} .pill.warn{color:var(--warn);background:var(--warnbg)} .pill.mut{color:var(--mut);background:#f1eeea}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;text-align:center} .meta div{background:#faf8f6;border-radius:10px;padding:7px 2px} .meta b{display:block;font-size:16px} .meta span{font-size:11px;color:var(--mut)}
.lic{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px}
.acts{display:flex;gap:8px} .acts button{flex:1}
.alert{font-size:13px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:7px 10px;margin-bottom:10px}
.msg{padding:10px 14px;border-radius:12px;margin-bottom:12px;background:var(--okbg);color:#0d5d44;font-weight:500} .msg.e{background:var(--badbg);color:#8a2f1b}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.scrim{position:fixed;inset:0;background:rgba(30,24,20,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:min(480px,100%);max-height:92vh;overflow:auto}
@media(min-width:600px){.scrim{align-items:center;padding:16px}.modal{border-radius:18px}}
.modal h3{margin:0 0 12px;font-size:18px} .f{display:grid;gap:12px;grid-template-columns:1fr 1fr} .f .w{grid-column:1/-1} .mut{color:var(--mut);font-size:13px}
.urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)} .urow .nm{flex:1;min-width:0} .urow .nm b{display:block;font-size:15px} .urow .nm span{display:flex;gap:5px;margin-top:3px}
.login{max-width:360px;margin:14vh auto;padding:0 16px} .login .card{padding:22px} .login label{margin-bottom:12px}
</style></head><body>
<div id="app"></div>
<script>
var T = ''; try { T = sessionStorage.getItem('st') || ''; } catch(e){}
var UL = null, D = null, M = null, MSG = null, WHO = '', FILTER = 'all', QUERY = '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
async function api(path, body){
  var r = await fetch(path, {method: body ? 'POST' : 'GET', headers: Object.assign({'Content-Type':'application/json'}, T ? {'X-Super-Token': T} : {}), body: body ? JSON.stringify(body) : undefined});
  var j = null; try { j = await r.json(); } catch(e){}
  if (r.status === 401 && T){ T = ''; try { sessionStorage.removeItem('st'); } catch(e){} D = null; render(); }
  if (!r.ok) throw new Error((j && j.error) || ('Server answered ' + r.status));
  return j;
}
function daysLeft(d){ if (!d) return null; var a = new Date(d + 'T23:59:59'), n = new Date(); return Math.ceil((a - n) / 86400000); }
function addDays(base, n){ var d = new Date(base + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); }
function ago(t){
  if (!t) return 'never';
  var m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 2) return 'online now'; if (m < 60) return m + ' min ago'; if (m < 1440) return Math.round(m / 60) + ' h ago'; return Math.round(m / 1440) + ' d ago';
}
function state(b){
  var n = daysLeft(b.expires_on);
  if (!b.active) return 'off';
  if (n !== null && n < 0) return 'expired';
  if (n !== null && n <= 30) return 'soon';
  return 'ok';
}
function licPill(b){
  var n = daysLeft(b.expires_on);
  if (n === null) return '<span class="pill mut">No end date</span>';
  if (n < 0) return '<span class="pill bad"><i></i>Expired ' + (-n) + ' d ago</span>';
  if (n <= 30) return '<span class="pill warn"><i></i>' + n + ' days left</span>';
  return '<span class="pill ok"><i></i>' + n + ' days left</span>';
}
function allBranches(){ var r = []; (D ? D.companies : []).forEach(function(c){ c.branches.forEach(function(b){ r.push(b); }); }); return r; }
function summary(){
  var bs = allBranches(), s = {co: D ? D.companies.length : 0, br: bs.length, act: 0, soon: 0, bad: 0, bills: 0};
  bs.forEach(function(b){ var st = state(b); if (st === 'ok' || st === 'soon') s.act++; if (st === 'soon') s.soon++; if (st === 'expired' || st === 'off') s.bad++; s.bills += b.bills; });
  return s;
}
function show(b){
  var st = state(b), q = QUERY.trim().toLowerCase();
  if (q && (b.name + ' ' + b.code).toLowerCase().indexOf(q) < 0) return false;
  if (FILTER === 'soon') return st === 'soon' || st === 'expired';
  if (FILTER === 'off') return st === 'off';
  if (FILTER === 'noadm') return !b.admins;
  return true;
}
function card(b){
  var st = state(b), statusPill = '<span class="pill ' + (b.active ? 'ok' : 'bad') + '"><i></i>' + (b.active ? 'Active' : 'Switched off') + '</span>';
  var h = '<div class="card"><div class="top"><div class="nm"><b>' + esc(b.name) + '</b><span><span class="code">' + esc(b.code) + '</span> &nbsp;Last seen ' + esc(ago(b.last_seen)) + '</span></div>' + statusPill + '</div>';
  h += '<div class="meta"><div><b>' + b.users + '/' + b.max_users + '</b><span>Users</span></div><div><b>' + b.devices + '</b><span>Devices</span></div><div><b>' + b.bills + '</b><span>Bills</span></div><div><b>' + b.admins + '</b><span>Admins</span></div></div>';
  if (!b.admins) h += '<div class="alert">No admin yet. Press Admin to create the first one.</div>';
  h += '<div class="lic"><span class="mut">Licence ' + (b.expires_on ? esc(b.expires_on) : '') + '</span>' + licPill(b) + '</div>';
  if (st === 'soon' || st === 'expired') h += '<div class="acts" style="margin-bottom:8px"><button class="sm pri" data-a="ext" data-b="' + esc(b.id) + '">Extend 1 year</button></div>';
  h += '<div class="acts"><button class="sm" data-a="edit" data-b="' + esc(b.id) + '">Edit</button><button class="sm" data-a="users" data-b="' + esc(b.id) + '">Users (' + b.users + ')</button><button class="sm" data-a="more" data-b="' + esc(b.id) + '">More</button></div></div>';
  return h;
}
function render(){
  var a = document.getElementById('app'), keep = document.getElementById('q'), had = keep && document.activeElement === keep, pos = had ? keep.selectionStart : 0;
  if (!T){
    a.innerHTML = '<div class="login"><div class="card"><h2 style="margin:0 0 16px">Super admin</h2>' + (MSG ? '<div class="msg e">' + esc(MSG) + '</div>' : '')
      + '<label>Name<input id="n" autocomplete="username" autocapitalize="off"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><button class="pri" id="go" style="width:100%">Sign in</button></div></div>';
    document.getElementById('go').onclick = login; document.getElementById('p').onkeydown = function(e){ if (e.key === 'Enter') login(); };
    return;
  }
  var s = summary(), h = '<header><h1>Super admin</h1><small>' + esc(WHO) + '</small><button class="sm" id="out">Sign out</button></header><main>';
  if (MSG && !M) h += '<div class="msg' + (MSG.e ? ' e' : '') + '">' + esc(MSG.t || MSG) + '</div>';
  h += '<div class="stats"><div class="stat"><b>' + s.br + '</b><span>Branches in ' + s.co + ' companies</span></div><div class="stat"><b>' + s.act + '</b><span>Active</span></div>'
    + '<div class="stat ' + (s.soon ? 'w' : '') + '"><b>' + s.soon + '</b><span>Licence ends within 30 days</span></div><div class="stat ' + (s.bad ? 'b' : '') + '"><b>' + s.bad + '</b><span>Expired or off</span></div></div>';
  h += '<div class="bar"><div class="s"><input id="q" type="search" placeholder="Search branch or shop code" value="' + esc(QUERY) + '"></div><button class="pri" id="cnew">+ Company</button></div>';
  h += '<div class="chips" style="margin-bottom:6px">' + [['all', 'All'], ['soon', 'Ending soon'], ['off', 'Switched off'], ['noadm', 'No admin']].map(function(c){ return '<button class="chip' + (FILTER === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>';
  var any = false;
  (D ? D.companies : []).forEach(function(c){
    var list = c.branches.filter(show);
    if (!list.length && (FILTER !== 'all' || QUERY)) return;
    any = true;
    h += '<div class="co"><h2>' + esc(c.name) + '</h2><button class="sm gh" data-a="newb" data-c="' + esc(c.id) + '">+ Branch</button></div>';
    h += list.length ? '<div class="grid">' + list.map(card).join('') + '</div>' : '<div class="empty">No branches yet.</div>';
  });
  if (!any) h += '<div class="empty">' + (D && D.companies.length ? 'Nothing matches.' : 'No companies yet. Press + Company to start.') + '</div>';
  h += '</main>' + (M ? modal() : '');
  a.innerHTML = h;
  document.getElementById('out').onclick = async function(){ try { await api('/super/logout', {}); } catch(e){} T = ''; try { sessionStorage.removeItem('st'); } catch(e){} D = null; render(); };
  document.getElementById('cnew').onclick = function(){ M = {a: 'newc'}; MSG = null; render(); };
  var q = document.getElementById('q'); q.oninput = function(){ QUERY = q.value; render(); }; if (had){ q.focus(); try { q.setSelectionRange(pos, pos); } catch(e){} }
  [].forEach.call(document.querySelectorAll('[data-f]'), function(el){ el.onclick = function(){ FILTER = el.dataset.f; render(); }; });
  [].forEach.call(document.querySelectorAll('[data-a]'), function(el){ el.onclick = function(){ M = {a: el.dataset.a, b: el.dataset.b, c: el.dataset.c}; MSG = null; if (M.a === 'users') loadUsers(); render(); }; });
  if (M) wire();
}
function findB(id){ var r = null; allBranches().forEach(function(b){ if (b.id === id) r = b; }); return r; }
function modal(){
  var b = M.b ? findB(M.b) : null, h = '<div class="scrim" id="scr"><div class="modal">', title = '', body = '', btn = 'Save', cls = 'pri';
  if (M.a === 'newc'){ title = 'New company'; body = '<label>Company name<input id="f1" placeholder="Company name"></label>'; btn = 'Add company'; }
  if (M.a === 'newb'){ title = 'New branch'; body = '<div class="f"><label class="w">Branch name<input id="f1" placeholder="Main branch"></label><label>Shop code<input id="f2" placeholder="abc1" autocapitalize="off"></label><label>Users allowed<input id="f3" type="number" inputmode="numeric" min="1" value="3"></label><label class="w">Licence ends (optional)<input id="f4" type="date"></label></div><p class="mut">The shop code is typed once on each device. Create the branch admin next.</p>'; btn = 'Add branch'; }
  if (M.a === 'edit'){ title = 'Edit ' + esc(b.code); body = '<div class="f"><label class="w">Branch name<input id="f1" value="' + esc(b.name) + '"></label><label>Users allowed<input id="f3" type="number" inputmode="numeric" min="1" value="' + b.max_users + '"></label><label>Licence ends<input id="f4" type="date" value="' + esc(b.expires_on || '') + '"></label><div class="w row"><button class="sm" data-x="30">+30 days</button><button class="sm" data-x="365">+1 year</button><button class="sm" data-x="clr">No end date</button></div><label class="w">Status<select id="f5"><option value="1"' + (b.active ? ' selected' : '') + '>Active</option><option value="0"' + (!b.active ? ' selected' : '') + '>Switched off (nobody can sign in)</option></select></label></div>'; }
  if (M.a === 'ext'){ title = 'Extend licence'; body = '<p>' + esc(b.name) + ' (' + esc(b.code) + ')<br>Now: <b>' + esc(b.expires_on || 'no end date') + '</b><br>New end date: <b>' + esc(addDays((b.expires_on && daysLeft(b.expires_on) > 0) ? b.expires_on : new Date().toLocaleDateString('en-CA'), 365)) + '</b></p>'; btn = 'Extend 1 year'; }
  if (M.a === 'adm'){ title = 'Admin PIN for ' + esc(b.code); body = '<div class="f"><label>Admin name<input id="f1" autocapitalize="off"></label><label>PIN (6+ digits)<input id="f2" type="password" inputmode="numeric" autocomplete="new-password"></label></div><p class="mut">Creates the admin, or resets the PIN if the name exists. The admin then makes the branch users (' + b.users + ' of ' + b.max_users + ' used).</p>'; }
  if (M.a === 'users'){
    title = esc(b.name) + ' users';
    body = !UL ? '<p class="mut">Loading…</p>' : (UL.error ? '<div class="msg e">' + esc(UL.error) + '</div>' : (UL.users.length ? UL.users.map(function(u){ return '<div class="urow"><div class="nm"><b>' + esc(u.name) + '</b><span><span class="pill ' + (u.role === 'Owner' ? 'warn' : 'mut') + '">' + esc(u.role) + '</span> <span class="pill ' + (u.active ? 'ok' : 'bad') + '"><i></i>' + (u.active ? 'Active' : 'Off') + '</span></span></div><button class="sm" data-u="' + esc(u.id) + '">Manage</button></div>'; }).join('') : '<p class="mut">No users yet.</p>'))
      + '<p class="mut" style="margin-top:12px">PINs are stored scrambled, so they cannot be shown. Use Manage to set a new one. Users: ' + b.users + ' of ' + b.max_users + '.</p><button class="sm" data-a="adm" data-b="' + esc(b.id) + '" style="margin-top:4px">+ Add / reset an admin</button>';
    btn = '';
  }
  if (M.a === 'user'){
    var u = UL && UL.users.filter(function(x){ return x.id === M.u; })[0] || {name: '', role: '', active: true};
    title = esc(u.name); body = '<p class="mut">' + esc(u.role) + ' · ' + (u.active ? 'Active' : 'Switched off') + '</p><label>New PIN (6+ digits)<input id="f1" type="password" inputmode="numeric" autocomplete="new-password"></label><p class="mut">Leave empty to keep the current PIN.</p>'
      + '<div class="row"><button class="sm ' + (u.active ? 'dng' : '') + '" id="tog">' + (u.active ? 'Switch user off' : 'Switch user on') + '</button><button class="sm dng" id="del">Delete user</button></div><p class="mut">Delete works only for a user with no bills or records. Otherwise switch the user off.</p>'; btn = 'Set PIN';
  }
  if (M.a === 'more'){ title = esc(b.name); body = '<div class="row" style="flex-direction:column;align-items:stretch"><button id="cpy">Copy shop code (' + esc(b.code) + ')</button><button class="dng" data-a="rst" data-b="' + esc(b.id) + '">Go-live reset…</button></div>'; btn = ''; }
  if (M.a === 'rst'){ title = 'Go-live reset'; body = '<p>Starts <b>' + esc(b.code) + '</b> from zero on every device.</p><p class="mut" style="margin:6px 0 0"><b>Cleared:</b> bills, tablet orders, purchases, expenses, cash and bank entries, credit payments, stock counts, waste, day closings, the audit log, and all stock (shop and warehouse, set to 0).</p><p class="mut" style="margin:6px 0 10px"><b>Kept:</b> users, their roles and permissions, menu and prices, settings, expense categories, materials, recipes, portions, suppliers and customers.</p><p><b>This cannot be undone.</b></p><label>Type the shop code to confirm<input id="f1" autocapitalize="off" placeholder="' + esc(b.code) + '"></label>'; btn = 'Reset'; cls = 'dng'; }
  h += '<h3>' + title + '</h3>' + (MSG && M.a !== 'newc' ? '<div class="msg' + (MSG.e ? ' e' : '') + '">' + esc(MSG.t || MSG) + '</div>' : '') + body + '<div class="row" style="justify-content:flex-end;margin-top:16px"><button id="cx">' + (btn ? 'Cancel' : 'Close') + '</button>' + (btn ? '<button class="' + cls + '" id="ok">' + btn + '</button>' : '') + '</div></div></div>';
  return h;
}
function wire(){
  var $ = function(i){ return document.getElementById(i); };
  $('cx').onclick = function(){ M = (M.a === 'user' || (M.a === 'adm' && UL)) ? {a: 'users', b: M.b} : null; if (M && M.a === 'users') loadUsers(); render(); }; $('scr').onclick = function(e){ if (e.target.id === 'scr'){ M = null; render(); } };
  [].forEach.call(document.querySelectorAll('.modal [data-a]'), function(el){ el.onclick = function(){ M = {a: el.dataset.a, b: el.dataset.b}; render(); }; });
  if ($('cpy')) $('cpy').onclick = function(){ var b = findB(M.b); try { navigator.clipboard.writeText(b.code); } catch(e){} M = null; MSG = {t: 'Shop code copied.'}; render(); };
  [].forEach.call(document.querySelectorAll('[data-x]'), function(el){ el.onclick = function(){ var x = el.dataset.x, f = $('f4'); if (x === 'clr') f.value = ''; else { var cur = f.value, t = new Date().toLocaleDateString('en-CA'); f.value = addDays(cur && cur > t ? cur : t, +x); } }; });
  [].forEach.call(document.querySelectorAll('[data-u]'), function(el){ el.onclick = function(){ M = {a: 'user', b: M.b, u: el.dataset.u}; MSG = null; render(); }; });
  if ($('tog')) $('tog').onclick = function(){ var u = UL.users.filter(function(x){ return x.id === M.u; })[0]; userOp({active: !u.active}, u.active ? 'User switched off.' : 'User switched on.'); };
  if ($('del')) $('del').onclick = function(){ var u = UL.users.filter(function(x){ return x.id === M.u; })[0]; if (window.confirm('Delete ' + u.name + '? This cannot be undone.')) userOp({delete: true}, 'User deleted.'); };
  if (!$('ok')) return;
  $('ok').onclick = function(){
    var a = M.a, id = M.b, b = id ? findB(id) : null;
    if (a === 'user'){ if (!$('f1').value) return; return userOp({pin: $('f1').value}, 'PIN changed.'); }
    run(function(){
      if (a === 'newc') return api('/super/company', {name: $('f1').value});
      if (a === 'newb') return api('/super/branch', {company_id: M.c, name: $('f1').value, code: $('f2').value, max_users: $('f3').value, expires_on: $('f4').value});
      if (a === 'edit') return api('/super/branch/' + id, {name: $('f1').value, max_users: $('f3').value, expires_on: $('f4').value, active: $('f5').value === '1'});
      if (a === 'ext') return api('/super/branch/' + id, {expires_on: addDays((b.expires_on && daysLeft(b.expires_on) > 0) ? b.expires_on : new Date().toLocaleDateString('en-CA'), 365)});
      if (a === 'adm') return api('/super/branch/' + id + '/admin', {name: $('f1').value, pin: $('f2').value});
      if (a === 'rst') return api('/super/branch/' + id + '/reset-test', {confirm: $('f1').value});
    }, a === 'rst' ? 'Go-live reset done.' : a === 'ext' ? 'Licence extended by one year.' : a === 'newc' ? 'Company added.' : a === 'adm' ? 'Admin saved.' : 'Saved.');
  };
}
async function loadUsers(){
  UL = null; var id = M && M.b;
  try { UL = await api('/super/branch/' + id + '/users'); } catch(e){ UL = {error: e.message, users: []}; }
  if (M && M.a === 'users' && M.b === id) render();
}
async function userOp(body, ok){
  var id = M.b, uid = M.u;
  try { D = await api('/super/branch/' + id + '/user', Object.assign({user_id: uid}, body)); MSG = {t: ok}; M = {a: 'users', b: id}; await loadUsers(); }
  catch(e){ MSG = {t: e.message, e: 1}; M = {a: 'users', b: id}; }
  render(); if (MSG && MSG.e){ try { window.scrollTo(0, 0); } catch(e2){} }
