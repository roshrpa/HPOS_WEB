# Run on the server:  cp .env.example .env   (edit it)   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpos
      POSTGRES_USER: hpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpos -d hpos"]
      interval: 5s
      timeout: 3s
      retries: 10
    # the database is not published to the internet; only the api container can reach it

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hpos:${POSTGRES_PASSWORD}@db:5432/hpos
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (at least 16 characters)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      WEB_DIR: /web
      PORT: "3000"
    volumes:
      - ./tablet/index.html:/web/index.html:ro        # order pad (run ./get-tablet-app.sh to update)
      - ../index.html:/web/pos/index.html:ro          # POS

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
